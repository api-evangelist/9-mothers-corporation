name: 9 Mothers Corporation
description: 9 Mothers Corporation is a defense technology company founded in 2024 and based in Austin,
  Texas, building AI-powered counter-drone (C-sUAS) point defense systems for the FPV drone era. Its
  flagship product, EDDA, is a small, low-power, autonomous-capable point-defense turret that engages
  Group 1 suicide drones at 10-100+ meter range to protect soldiers, vehicles, and critical assets. A
  Y Combinator Spring 2026 company with reported sales to the U.S. Department of War, its roadmap includes
  Vor (passive acoustic sensor), Atla (belt-fed shotgun system), and Gleipnir (counter-drone for larger
  platforms). This profile was surfaced as a Y Combinator portfolio company and added to the API Evangelist
  network. The company publishes no public API, SDK, or developer portal.
